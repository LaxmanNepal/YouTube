<!doctype html><html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Idea 12</title><link rel="stylesheet" href="../style.css"></head><body><header class="topbar glass"><div class="brand"><div class="brand-mark">LN</div><div><strong>Laxman Nepal Official</strong><span>YouTube Growth Intelligence</span></div></div><a class="channel-btn" href="../index.html">← Dashboard</a></header><main id="p"></main><script>const r=12,e=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));fetch('../data/growth-data.json?v='+Date.now()).then(x=>x.json()).then(d=>{let t=d.topics[r-1],s=t.shorts||[],l=t.long_video?.script||t.long_video_script||'';p.innerHTML=`<section class="hero glass"><span class="eyebrow">#${t.rank} · ${e(t.audience)} · ${e(t.market)} · ${e(t.category)}</span><h1>${e(t.topic)}</h1><p>Research: ${e(d.updated_at)}</p><div class="hero-stats"><div class="stat"><b>${e(t.seo_score||t.score)}/100</b><span>SEO</span></div><div class="stat"><b>${e(t.score)}/100</b><span>OPPORTUNITY</span></div><div class="stat"><b>${e(t.demand)}</b><span>DEMAND</span></div><div class="stat"><b>${e(t.competition)}</b><span>COMPETITION</span></div></div></section><section class="workflow-grid"><article class="glass workflow"><b>TITLE</b><h3>${e(t.recommended_title)}</h3><p>${e(t.why_make)}</p></article><article class="glass workflow"><b>ALTERNATIVES</b><p>${e((t.titles||[]).join(' · '))}</p></article><article class="glass workflow"><b>DESCRIPTION / TAGS</b><p>${e(t.description)}</p><p>${e((t.tags||[]).join(', '))}</p></article><article class="glass workflow"><b>THUMBNAIL</b><h3>${e(t.thumbnail?.text)}</h3><pre>${e(t.thumbnail?.prompt)}</pre></article></section><section class="section-head"><h2>Long video · Nepali script</h2></section><article class="glass workflow"><pre>${e(l)}</pre></article><section class="section-head"><h2>Shorts · Nepali</h2></section>${s.map((x,i)=>`<article class="glass workflow"><b>SHORT ${i+1} · ${e(x.title)}</b><pre>${e(x.script)}</pre></article>`).join('')}<section class="section-head"><h2>Video editing</h2></section><article class="glass workflow"><pre>${e(JSON.stringify(t.editing||{},null,2))}</pre></article>`})</script></body></html>
