<!doctype html><html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Idea 04 · Laxman Nepal Official</title><link rel="stylesheet" href="../style.css"></head><body><header class="topbar glass"><div class="brand"><div class="brand-mark">LN</div><div><strong>Laxman Nepal Official</strong><span>YouTube Growth Intelligence</span></div></div><a class="channel-btn" href="../index.html">← Dashboard</a></header><main id="page"></main><script>const rank=4,E=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));fetch('../data/growth-data.json?v='+Date.now()).then(r=>r.json()).then(d=>{let t=d.topics.find(x=>+x.rank===rank)||d.topics[rank-1],s=t.shorts||[],l=t.long_video?.script||t.long_video_script||'',e=t.editing||{};document.title=t.topic+' · Laxman Nepal Official';page.innerHTML=`<section class="hero glass"><span class="eyebrow">#${t.rank} · ${E(t.audience)} · ${E(t.market)} · ${E(t.category)}</span><h1>${E(t.topic)}</h1><p>Research snapshot: ${E(d.updated_at)}</p><div class="hero-stats"><div class="stat"><b>${E(t.seo_score||t.score)}/100</b><span>SEO SCORE</span></div><div class="stat"><b>${E(t.score)}/100</b><span>OPPORTUNITY</span></div><div class="stat"><b>${E(t.demand)}</b><span>DEMAND</span></div><div class="stat"><b>${E(t.competition)}</b><span>COMPETITION</span></div></div></section><section class="section-head"><div><span class="eyebrow">PUBLISHING PACKAGE</span><h2>SEO + CTR</h2></div></section><section class="workflow-grid"><article class="glass workflow"><b>RECOMMENDED TITLE</b><h3>${E(t.recommended_title)}</h3><p>${E(t.why_make)}</p></article><article class="glass workflow"><b>ALTERNATIVE TITLES</b><p>${E((t.titles||[]).join(' · '))}</p></article><article class="glass workflow"><b>DESCRIPTION + TAGS</b><p>${E(t.description)}</p><p><b>Tags:</b> ${E((t.tags||[]).join(', '))}</p><p><b>Hashtags:</b> ${E((t.hashtags||[]).join(' '))}</p></article><article class="glass workflow"><b>THUMBNAIL</b><h3>${E(t.thumbnail?.text)}</h3><p>${E(t.thumbnail?.concept)}</p><pre>${E(t.thumbnail?.prompt)}</pre></article></section><section class="section-head"><div><span class="eyebrow">LONG VIDEO · NEPALI SCRIPT</span><h2>Complete long-form</h2></div></section><article class="glass workflow"><pre>${E(l)}</pre></article><section class="section-head"><div><span class="eyebrow">SHORTS · NEPALI</span><h2>Separate Shorts</h2></div></section>${s.map((x,i)=>`<article class="glass workflow"><b>SHORT ${i+1} · ${E(x.title)}</b><pre>${E(x.script)}</pre><p>9:16 · immediate hook · captions · fast cuts.</p></article>`).join('')}<section class="section-head"><div><span class="eyebrow">VIDEO EDITING</span><h2>Production blueprint</h2></div></section><article class="glass workflow"><pre>${E(JSON.stringify(e,null,2))}</pre><p>Show result first, remove dead air, visual change every 2–5 seconds, use real screen recordings, proof and Nepali captions.</p></article>`})</script></body></html>
