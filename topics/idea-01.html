<!doctype html><html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Idea 01 · Laxman Nepal Official</title><link rel="stylesheet" href="../style.css"></head><body><header class="topbar glass"><div class="brand"><div class="brand-mark">LN</div><div><strong>Laxman Nepal Official</strong><span>YouTube Growth Intelligence</span></div></div><a class="channel-btn" href="../index.html">← Dashboard</a></header><main id="page"><section class="hero glass"><span class="eyebrow">LOADING IDEA #1</span><h1>Loading…</h1></section></main><script>const rank=1;const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));fetch('../data/growth-data.json?v='+Date.now()).then(r=>r.json()).then(d=>{const t=d.topics.find(x=>Number(x.rank)===rank)||d.topics[rank-1];const l=t.long_video?.script||t.long_video_script||'';const shorts=t.shorts||[];const e=t.editing||{};document.title=t.topic+' · Laxman Nepal Official';document.querySelector('#page').innerHTML=`<section class="hero glass"><span class="eyebrow">#${esc(t.rank)} · ${esc(t.audience)} · ${esc(t.market)} · ${esc(t.category)}</span><h1>${esc(t.topic)}</h1><p>Research snapshot: ${esc(d.updated_at)}</p><div class="hero-stats"><div class="stat"><b>${esc(t.seo_score||t.score)}/100</b><span>SEO SCORE</span></div><div class="stat"><b>${esc(t.score)}/100</b><span>OPPORTUNITY</span></div><div class="stat"><b>${esc(t.demand)}</b><span>DEMAND</span></div><div class="stat"><b>${esc(t.competition)}</b><span>COMPETITION</span></div></div></section><section class="section-head"><div><span class="eyebrow">COMPLETE PUBLISHING PACKAGE</span><h2>SEO + CTR</h2></div></section><section class="workflow-grid"><article class="glass workflow"><b>RECOMMENDED TITLE</b><h3>${esc(t.recommended_title)}</h3><p>${esc(t.why_make)}</p></article><article class="glass workflow"><b>ALTERNATIVE TITLES</b><p>${esc((t.titles||[]).join(' · '))}</p></article><article class="glass workflow"><b>DESCRIPTION</b><p>${esc(t.description)}</p><p><b>Tags:</b> ${esc((t.tags||[]).join(', '))}</p><p><b>Hashtags:</b> ${esc((t.hashtags||[]).join(' '))}</p></article><article class="glass workflow"><b>THUMBNAIL</b><h3>${esc(t.thumbnail?.text)}</h3><p>${esc(t.thumbnail?.concept)}</p><pre>${esc(t.thumbnail?.prompt)}</pre></article></section><section class="section-head"><div><span class="eyebrow">LONG VIDEO · NEPALI</span><h2>Complete Nepali script</h2></div></section><article class="glass workflow"><pre>${esc(l)}</pre></article><section class="section-head"><div><span class="eyebrow">SHORTS · NEPALI</span><h2>Separate Shorts</h2></div></section>${shorts.map((s,i)=>`<article class="glass workflow"><b>SHORT ${i+1} · ${esc(s.title)}</b><pre>${esc(s.script)}</pre><p>9:16 · hook in 1–2 seconds · captions · fast cuts · visual proof.</p></article>`).join('')}<section class="section-head"><div><span class="eyebrow">VIDEO EDITING</span><h2>Production blueprint</h2></div></section><article class="glass workflow"><pre>${esc(JSON.stringify(e,null,2))}</pre><p>Show the result first, cut dead air, change visuals every 2–5 seconds, use screen recordings and Nepali captions, and build the strongest reveal toward the final third.</p></article></main>`}).catch(()=>document.querySelector('#page').innerHTML='<section class="hero glass"><h1>Idea data unavailable</h1><p>Refresh after the latest GitHub dataset is deployed.</p></section>')</script></body></html>
