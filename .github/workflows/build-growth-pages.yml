name: Build Growth Pages and Archive
on:
  push:
    paths:
      - 'data/growth-data.json'
      - 'data/growth-update-*.json'
      - 'scripts/build_growth_pages.py'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Generate topic pages and archive
        run: python scripts/build_growth_pages.py
      - name: Commit generated pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add topics archive
          git diff --cached --quiet || git commit -m 'Auto-build topic pages and permanent archive'
          git push
      # Rebuild all generated topic pages from the canonical growth dataset.